# Optional Lovelace view for SleepRadar.
#
# Requirements:
# - SleepRadar Card registered as /local/sleepradar-card.js
# - ApexCharts Card
# - Mushroom cards and sleep_tracking.yaml for the optional Cross-check section
# - An independent occupancy source named binary_sensor.bed_occupied
#
# The occupancy entity must not be derived from the FP2 sleep-state sensor.
# The gate changes the live card only. "Last night" remains raw sensor
# telemetry stored by Recorder and therefore shows only indicative codes 3–5.

- title: Sleep
  path: sleep
  icon: mdi:sleep
  type: sections
  max_columns: 3
  sections:
    - type: grid
      column_span: 1
      cards:
        - type: heading
          heading: Now
          heading_style: title
          icon: mdi:sleep

        - type: custom:sleepradar-card
          # Fail closed unless an independent source confirms occupancy.
          bed_occupancy:
            entity: binary_sensor.bed_occupied
            occupied_states: ['on']

    - type: grid
      column_span: 2
      cards:
        - type: heading
          heading: Last night (raw Aqara telemetry)
          heading_style: title
          icon: mdi:chart-timeline-variant

        # Window = the previous night. start: day anchors at local 00:00,
        # offset -2h shifts to 22:00 the evening before, graph_span 12h ends at
        # 10:00 — so this shows last night's session all day, not a rolling 12h.
        - type: custom:apexcharts-card
          header:
            show: true
            title: Sleep state
            show_states: false
          graph_span: 12h
          span:
            start: day
            offset: '-2h'
          apex_config:
            chart:
              height: 240
              toolbar:
                show: false
            stroke:
              curve: stepline
              width: 3
            markers:
              size: 0
            yaxis:
              min: 3
              max: 5
              tickAmount: 2
              reversed: true
              labels:
                formatter: |
                  EVAL:function(value) {
                    const phases = {
                      3: "REM (indicative)",
                      4: "Light (indicative)",
                      5: "Deep (indicative)"
                    };
                    return phases[Math.round(value)] ?? "";
                  }
          series:
            - entity: sensor.aqara_fp2_sleep_sleep_state
              name: Sleep state
              type: line
              stroke_width: 3
              # DESIGN.md tokens (colorblind-safe, no green): radar blue for
              # sleep state and breathing, heart red for heart rate. Amber
              # #f5a623 is reserved for REM timeline segments, so not used here.
              color: '#5aa2ff'
              # Codes 0–2 have no verified public meaning and become gaps.
              transform: "return x === null || !Number.isFinite(Number(x)) || Number(x) < 3 || Number(x) > 5 ? null : Number(x);"

        - type: custom:apexcharts-card
          header:
            show: true
            title: Heart rate
            show_states: false
          graph_span: 12h
          span:
            start: day
            offset: '-2h'
          apex_config:
            chart:
              height: 200
              toolbar:
                show: false
            stroke:
              curve: smooth
              width: 2
            markers:
              size: 0
            yaxis:
              decimalsInFloat: 0
          series:
            - entity: sensor.aqara_fp2_sleep_heart_rate
              name: Heart rate
              type: line
              stroke_width: 2
              color: '#ff4d57'
              unit: ' bpm'

        - type: custom:apexcharts-card
          header:
            show: true
            title: Breathing
            show_states: false
          graph_span: 12h
          span:
            start: day
            offset: '-2h'
          apex_config:
            chart:
              height: 200
              toolbar:
                show: false
            stroke:
              curve: smooth
              width: 2
            markers:
              size: 0
            yaxis:
              decimalsInFloat: 0
          series:
            - entity: sensor.aqara_fp2_sleep_respiration_rate
              name: Breathing
              type: line
              stroke_width: 2
              color: '#5aa2ff'
              unit: ' br/min'

        # Native markdown card (no dependency): describe what is reported and
        # where the independent occupancy gate does and does not apply.
        - type: markdown
          content: >-
            Heart rate and breathing are sensor-reported by the FP2. Codes 3–5
            are shown as indicative sleep stages. These charts are raw MQTT
            telemetry from Recorder and do not apply the live card's occupancy
            gate, so retained values can still appear while the bed is empty.

    - type: grid
      column_span: 3
      cards:
        # Optional: delete this grid if you do not need a visible cross-check.
        - type: heading
          heading: Cross-check
          heading_style: title
          icon: mdi:check-decagram-outline

        - type: custom:mushroom-template-card
          entity: binary_sensor.bed_occupied
          primary: FP2 vs bed status
          secondary: >-
            FP2: {{ states('sensor.fp2_sleep_phase') }} ·
            Bed occupied: {{ states('binary_sensor.bed_occupied') }}
          icon: mdi:bed-clock
          icon_color: blue
          multiline_secondary: true
