# Optional example automations for SleepRadar.
#
# These show what becomes possible once sleep data is available as Home
# Assistant entities. They act only when a separate
# binary_sensor.bed_occupied confirms occupancy.
#
# They use binary_sensor.fp2_asleep and sensor.fp2_sleep_phase from
# sleep_tracking.yaml. "Asleep" requires confirmed occupancy plus an indicative
# code 3, 4, or 5. If the occupancy source is unknown or unavailable, the
# helper fails closed and these automations do not run.
#
# Replace every PLACEHOLDER_* value with your own entity IDs.

- alias: "Cap light brightness while asleep"
  description: >-
    When a bedroom light turns on while occupied sleep is indicated, hold it
    to a low brightness instead of full.
  trigger:
    - platform: state
      entity_id: PLACEHOLDER_BEDROOM_LIGHT
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.fp2_asleep
      state: "on"
  action:
    - alias: "Dim the light to 20 percent"
      service: light.turn_on
      target:
        entity_id: PLACEHOLDER_BEDROOM_LIGHT
      data:
        brightness_pct: 20
  mode: single

- alias: "Hold the vacuum until awake"
  description: >-
    If the robot vacuum starts while occupied sleep is indicated, send it back
    to the dock.
  trigger:
    - platform: state
      entity_id: PLACEHOLDER_VACUUM
      to: "cleaning"
  condition:
    - condition: state
      entity_id: binary_sensor.fp2_asleep
      state: "on"
  action:
    - alias: "Return the vacuum to base"
      service: vacuum.return_to_base
      target:
        entity_id: PLACEHOLDER_VACUUM
  mode: single

- alias: "Cool down during deep sleep"
  description: >-
    Nudge the bedroom thermostat down when occupied deep sleep is indicated.
    This is a comfort example, not a safety control.
  trigger:
    - platform: state
      entity_id: sensor.fp2_sleep_phase
      to: "Deep sleep (indicative)"
  condition:
    - condition: state
      entity_id: binary_sensor.bed_occupied
      state: "on"
  action:
    - alias: "Lower the target temperature"
      service: climate.set_temperature
      target:
        entity_id: PLACEHOLDER_BEDROOM_THERMOSTAT
      data:
        temperature: 18
  mode: single
