#:schema https://conductor.build/schemas/settings.repo.schema.json

# run.sh is bashio-only (real HA Supervisor + real MQTT broker + real Aqara
# credentials) and cannot run standalone — never wire it into scripts.run.
# The safe, useful local action is the same lint+validate loop CI and
# CONTRIBUTING.md require before every PR.
#
# The stdlib-only bootstrap can start under macOS system Python 3.9. It probes
# each 3.11+ candidate in isolation before creating or repairing .venv.

[scripts]
setup = "python3 scripts/setup_workspace.py"
run = "git diff --check && .venv/bin/python -m py_compile aqara_fp2_sleep/aqara_fp2_sleep_poller.py scripts/setup_workspace.py scripts/validate_repository.py videos/quiet_proof_loops.py videos/validate-gif-batch.py videos/build-gif-deliverables.py && .venv/bin/yamllint -c .yamllint . && .venv/bin/python scripts/validate_repository.py && .venv/bin/python scripts/validate_repository.py --self-test && .venv/bin/python tests/test_validate_repository_cli.py && .venv/bin/python tests/test_setup_workspace.py && .venv/bin/python videos/validate-gif-batch.py && .venv/bin/python videos/validate-gif-batch.py --self-test && .venv/bin/python videos/build-gif-deliverables.py --self-test && .venv/bin/python videos/validate-gif-batch.py --check-baseline videos/gif-batch-baseline-sha256.json && node tests/sleepradar-card.test.js && bash -n aqara_fp2_sleep/run.sh"
run_mode = "concurrent"
