name: SleepRadar
version: "1.3.0"
slug: aqara_fp2_sleep
description: Contact-free FP2 sleep vitals for Home Assistant.
url: https://github.com/florianhorner/ha-fp2-sleep
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
hassio_api: false
# Used for one thing: raising and dismissing the persistent notification that
# names why the Aqara connection is down and how to fix it. Without it the only
# signal is five sensors going unavailable with no reason attached. The add-on
# runs fine if the call is refused; see call_core_service.
homeassistant_api: true
services:
  - mqtt:need
options:
  aqara_username: ""
  aqara_password: ""
  aqara_area: "EU"
  subject_id: ""
  poll_interval: 60
  log_level: info
  device_name: "Aqara FP2 Sleep Monitor"
  mqtt_node_id: "aqara_fp2_sleep"
schema:
  aqara_username: str
  aqara_password: password
  aqara_area: list(CN|EU|USA|RU|KR)
  subject_id: str
  poll_interval: int(15,3600)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  device_name: str
  mqtt_node_id: str
